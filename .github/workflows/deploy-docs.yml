name: Deploy API Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/api-docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build docs
        run: node docs/api-docs/build.js

      - name: Copy assets
        run: |
          mkdir -p docs/api-docs/_site
          cp docs/api-docs/index.html docs/api-docs/_site/
          cp docs/formiq-logo.png docs/api-docs/_site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api-docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
