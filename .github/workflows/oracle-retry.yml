name: Oracle Instance Retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  create-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Setup OCI Config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ap-hyderabad-1
          EOF

      - name: Check if instance already exists
        id: check
        run: |
          RESULT=$(oci compute instance list --compartment-id ${{ secrets.OCI_TENANCY_OCID }} --display-name crm-pro-vps --lifecycle-state RUNNING --query "data[0].id" --raw-output 2>/dev/null || echo "")
          if [ -n "$RESULT" ] && [ "$RESULT" != "null" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Instance already running: $RESULT"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Retry launch (10 attempts, 30s apart)
        if: steps.check.outputs.exists == 'false'
        run: |
          for i in $(seq 1 10); do
            echo "Attempt $i/10 at $(date)"
            oci compute instance launch \
              --compartment-id ${{ secrets.OCI_TENANCY_OCID }} \
              --availability-domain NREd:AP-HYDERABAD-1-AD-1 \
              --shape VM.Standard.A1.Flex \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --image-id ocid1.image.oc1.ap-hyderabad-1.aaaaaaaapcliizjtvzjc47ddc4p3te2sw6f4eelood7tblia54d77t6skbha \
              --subnet-id ocid1.subnet.oc1.ap-hyderabad-1.aaaaaaaactmgx5gf7s5yd7myrdlknospao6tecmdstkd6zjezsh7dawgrwva \
              --display-name crm-pro-vps \
              --assign-public-ip true \
              --ssh-authorized-keys "${{ secrets.OCI_SSH_PUBLIC_KEY }}" && echo "SUCCESS" && exit 0
            echo "Failed, waiting 30s..."
            sleep 30
          done
          echo "All 10 attempts failed. Will retry next schedule."
          exit 1

      - name: Skip - already running
        if: steps.check.outputs.exists == 'true'
        run: echo "Instance already exists. Go to GitHub Actions and disable this workflow."
