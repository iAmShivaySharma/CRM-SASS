name: Deploy frontend to VPS

on:
  push:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: deploy-vps-frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image: ${{ steps.env.outputs.image }}
    steps:
      - id: env
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV=prod
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            ENV=staging
          else
            ENV=dev
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crm-sass" >> $GITHUB_OUTPUT

  build-push:
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            API_GATEWAY_URL=http://gateway:80
            NEXT_PUBLIC_APP_URL=${{ vars.APP_PUBLIC_URL || format('https://{0}', vars.DOMAIN) }}
            NEXT_PUBLIC_CASHFREE_ENV=${{ vars.CASHFREE_ENV || 'sandbox' }}
            NEXT_PUBLIC_META_APP_ID=${{ vars.META_APP_ID }}
          tags: |
            ${{ needs.resolve-env.outputs.image }}:${{ github.sha }}
            ${{ needs.resolve-env.outputs.image }}:${{ needs.resolve-env.outputs.environment }}
          cache-from: type=gha,scope=frontend-vps
          cache-to: type=gha,mode=max,scope=frontend-vps

  deploy:
    needs: [resolve-env, build-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            DIR=/opt/crm-platform/${{ needs.resolve-env.outputs.environment }}
            cd "$DIR"
            test -f docker-compose.yml || (echo "backend stack not deployed yet; run crm-platform deploy-vps first" && exit 1)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sed -i '/^FRONTEND_TAG=/d' deploy.env
            echo "FRONTEND_TAG=${{ github.sha }}" >> deploy.env
            ./infisical-sync.sh || true
            docker compose --env-file deploy.env pull frontend
            docker compose --env-file deploy.env up -d --no-deps frontend
            docker image prune -f
            sleep 15
            PORT=$(grep -E '^FRONTEND_PORT=' deploy.env | cut -d= -f2-)
            wget -qO- "http://localhost:${PORT:-3000}/healthz" || (docker compose logs --tail=50 frontend; exit 1)
